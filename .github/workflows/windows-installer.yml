name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and Inno Setup
        shell: pwsh
        run: |
          python -m pip install uv
          choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop\build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: WibeMusic-Setup
          path: desktop/dist/WibeMusic-Setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/WibeMusic-Setup.exe
