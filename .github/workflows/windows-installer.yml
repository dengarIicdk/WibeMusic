name: Windows installer

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build production web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $uv = (Get-Command uv).Source
          powershell -NoProfile -ExecutionPolicy Bypass -File desktop\build-installer.ps1 -Uv $uv

      - uses: actions/upload-artifact@v4
        with:
          name: WibeMusic-Setup-${{ github.sha }}
          path: desktop/dist/WibeMusic-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/WibeMusic-Setup.exe
